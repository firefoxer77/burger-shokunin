<title>バーガー職人</title>
<style>
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #fffff0;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;

  touch-action: none;
  overscroll-behavior: none;
  font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;

#game { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
#safe-top { position: fixed; top: 0; left: 0; width: 1px; height: env(safe-area-inset-top, 0px); pointer-events: none; visibility: hidden; }
#safe-bottom { position: fixed; bottom: 0; left: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); pointer-events: none; visibility: hidden; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 10; }
.overlay[hidden] { display: none; }
.dialog { background: #fffff4; border-radius: 18px; padding: 20px 22px; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
.dialog-title { font-size: 16px; color: #666; text-align: center; margin-bottom: 12px; }
.dialog-buttons { display: flex; gap: 10px; margin-top: 14px; }
.dialog-buttons button, .dialog-buttons .button {
  flex: 1; font-size: 16px; padding: 10px 0; border-radius: 999px; text-align: center; text-decoration: none;
  border: 2px solid #cfca7a; background: #fff; color: #666; font-family: inherit; box-sizing: border-box; line-height: 1.2;
}
.dialog-buttons .primary { background: #b9b356; border-color: #b9b356; color: #fff; }
#share-text {
  width: 100%; box-sizing: border-box; font-size: 14px; padding: 8px 10px; resize: none;
  border: 2px solid #e6e3b0; border-radius: 10px; background: #fff; color: #444; font-family: inherit;
}
</style>
<canvas id="game"></canvas>
<div id="safe-top"></div>

/* バーガー職人 - ゲームロジック（描画非依存・Nodeでテスト可能） */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // 具の定義。thick は積んだときの厚み（バンズ幅=1 に対する比）、kcal はカロリー
  const KINDS = {
    ketchup: { label: 'ケチャップ', thick: 0.035, kcal: 15 },
    patty:   { label: 'ハンバーグ', thick: 0.13,  kcal: 130 },
    lettuce: { label: 'レタス',     thick: 0.085, kcal: 3 },
    tomato:  { label: 'トマト',     thick: 0.045, kcal: 2 },
    cheese:  { label: 'チーズ',     thick: 0.04,  kcal: 60 },
    mayo:    { label: 'マヨ',       thick: 0.04,  kcal: 80 },
  };
  const FILLINGS = ['ketchup', 'patty', 'lettuce', 'tomato', 'cheese', 'mayo'];
  const BUN = { bottomThick: 0.17, kcal: 160, topLabel: '上のバンズ' };
  const SLOTS = 9;

  // 既定のレシピ（上から下の順）
  const DEFAULT_RECIPE = ['ketchup', 'patty', 'lettuce', 'tomato', 'cheese', 'patty', 'mayo', 'lettuce', 'ketchup'];

  const DEFAULTS = {
    bunW: 250,          // プレイ時のバンズの幅（論理px）
    swing: 120,         // 左右の振れ幅（中心から）
    baseOmega: 1.7,     // 最初の具の角速度 rad/s
    omegaStep: 0.24,    // 1個ごとの加速
    bunBoost: 1.45,     // 最後のバンズはさらに速い
    zeroAt: 0.3,        // ずれがバンズ幅のこの割合で 0 点
    perfect: 95,        // この点数以上で「ぴったり」
    gravity: 2600,      // 落下加速度 px/s^2
  };

  function sanitizeRecipe(r) {
    const out = [];
    for (let i = 0; i < SLOTS; i++) out.push(r && KINDS[r[i]] ? r[i] : DEFAULT_RECIPE[i]);
    return out;
  }

  function scoreFor(dx, opts) {
    const o = Object.assign({}, DEFAULTS, opts || {});
    const s = 100 * (1 - Math.abs(dx) / (o.zeroAt * o.bunW));
    return Math.max(0, Math.min(100, Math.round(s)));
  }

  function calories(recipe) {
    return BUN.kcal + recipe.reduce((a, k) => a + KINDS[k].kcal, 0);
  }

  function createGame(recipeTopDown, opts) {
    const o = Object.assign({}, DEFAULTS, opts || {});
    const rng = o.rng || Math.random;
    const recipe = sanitizeRecipe(recipeTopDown);
    // 落とす順番は下から上、最後に上のバンズ
    const order = recipe.slice().reverse().concat(['bunTop']);
    const g = {
      opts: o, recipe, order,
      index: 0,            // いま動いている具の番号
      placed: [],          // { kind, dx, score }
      phase: 0, omega: 0,
      state: 'swing',      // swing | fall | done
      fallY: 0, fallV: 0, dropX: 0,
      total: 0,
    };
    function setup() {
      g.phase = rng() * Math.PI * 2;
      g.omega = (o.baseOmega + o.omegaStep * g.index) * (g.order[g.index] === 'bunTop' ? o.bunBoost : 1);
      g.state = 'swing';
    }
    g.currentKind = () => g.order[g.index];
    g.offset = () => Math.sin(g.phase) * o.swing;   // 中心からのずれ
    g.update = function (dt) {
      if (g.state === 'swing') g.phase += g.omega * dt;
    };
    /** タップ：いまの位置で落とす。戻り値は落とした位置のずれ、または null */
    g.drop = function () {
      if (g.state !== 'swing') return null;
      g.dropX = g.offset();
      g.state = 'fall';
      return g.dropX;
    };
    /** 着地（描画側が落下アニメの終わりに呼ぶ）。戻り値 { kind, dx, score, perfect, finished } */
    g.land = function () {
      if (g.state !== 'fall') return null;
      const kind = g.currentKind();
      const score = scoreFor(g.dropX, o);
      const rec = { kind, dx: g.dropX, score };
      g.placed.push(rec);
      g.total += score;
      g.index++;
      const finished = g.index >= g.order.length;
      if (finished) g.state = 'done'; else setup();
      return Object.assign({ perfect: score >= o.perfect, finished }, rec);
    };
    /** 結果の一覧（上から下の順、原作の結果画面と同じ並び） */
    g.resultRows = function () {
      return g.placed.slice().reverse().map(p => ({
        label: p.kind === 'bunTop' ? BUN.topLabel : KINDS[p.kind].label, score: p.score,
      }));
    };
    g.calories = () => calories(recipe);
    setup();
    return g;

  function insertRanking(list, entry, max) {
    max = max || 10;
    let idx = list.length;
    for (let i = 0; i < list.length; i++) if (entry.score > list[i].score) { idx = i; break; }
    if (idx >= max) return 0;
    list.splice(idx, 0, entry);
    if (list.length > max) list.length = max;
    return idx + 1;

  function text(str, x, y, o) {
    o = o || {};
    ctx.save();
    ctx.font = o.font || ('14px ' + SANS); ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.baseline || 'middle';
    if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.lineWidth = o.strokeW || 4; ctx.strokeText(str, x, y); }
    ctx.fillStyle = o.color || COL.text; ctx.fillText(str, x, y);
    ctx.restore();
  }
  function menuText(str, x, y, size) {
    text(str, x, y, { font: 'bold ' + size + 'px ' + ROUND, color: '#fff', stroke: '#a8a8a8', strokeW: size * 0.2 });
    text(str, x, y, { font: 'bold ' + size + 'px ' + ROUND, color: '#fdfdf6' });
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function sunburst(cx, cy, c1, c2, n, rot) {
    const R = Math.hypot(L.W, L.H) * 1.3;
    ctx.save(); ctx.fillStyle = c1; ctx.fillRect(-20, -20, L.W + 40, L.H + 40); ctx.fillStyle = c2;
    for (let i = 0; i < n; i += 2) {
      const a0 = i / n * TAU + rot, a1 = (i + 1) / n * TAU + rot;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a0) * R, cy + Math.sin(a0) * R); ctx.lineTo(cx + Math.cos(a1) * R, cy + Math.sin(a1) * R); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function iconButton(x, y, s, draw, id) {
    ctx.save();
    roundRect(x - s / 2, y - s / 2, s, s, s * 0.17); ctx.fillStyle = COL.iconFill; ctx.fill();
    ctx.strokeStyle = COL.iconEdge; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = COL.icon; ctx.strokeStyle = COL.icon; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    draw(x, y, s * 0.3);
    ctx.restore();
    hitButtons.push({ x, y, w: s + 10, h: s + 10, id });
  }
  const ICON = {
    note(x, y, s) { ctx.lineWidth = s * 0.22; ctx.beginPath(); ctx.ellipse(x - s * 0.55, y + s * 0.6, s * 0.34, s * 0.26, -0.3, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(x + s * 0.5, y + s * 0.4, s * 0.34, s * 0.26, -0.3, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(x - s * 0.25, y + s * 0.6); ctx.lineTo(x - s * 0.25, y - s * 0.7); ctx.lineTo(x + s * 0.8, y - s * 0.9); ctx.lineTo(x + s * 0.8, y + s * 0.4); ctx.stroke(); },
    help(x, y, s) { text('?', x, y + 1, { font: 'bold ' + (s * 2.7) + 'px ' + SANS, color: COL.icon }); },
    list(x, y, s) { ctx.lineWidth = s * 0.2; roundRect(x - s * 0.85, y - s * 0.75, s * 1.7, s * 1.65, s * 0.2); ctx.fill(); ctx.strokeStyle = COL.iconFill; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x - s * 0.5, y - s * 0.2 + i * s * 0.38); ctx.lineTo(x + s * 0.5, y - s * 0.2 + i * s * 0.38); ctx.stroke(); } ctx.strokeStyle = COL.icon; ctx.lineWidth = s * 0.18; for (const dx of [-0.45, 0, 0.45]) { ctx.beginPath(); ctx.moveTo(x + dx * s, y - s * 1.0); ctx.lineTo(x + dx * s, y - s * 0.6); ctx.stroke(); } },
    share(x, y, s) { ctx.lineWidth = s * 0.22; ctx.beginPath(); ctx.moveTo(x - s * 0.6, y - s * 0.05); ctx.lineTo(x - s * 0.6, y + s * 0.85); ctx.lineTo(x + s * 0.6, y + s * 0.85); ctx.lineTo(x + s * 0.6, y - s * 0.05); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y + s * 0.4); ctx.lineTo(x, y - s * 0.9); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - s * 0.4, y - s * 0.5); ctx.lineTo(x, y - s * 0.95); ctx.lineTo(x + s * 0.4, y - s * 0.5); ctx.stroke(); },
    info(x, y, s) { text('i', x, y + 1, { font: 'italic bold ' + (s * 2.9) + 'px ' + SERIF, color: COL.icon }); },
    close(x, y, s) { ctx.lineWidth = s * 0.45; ctx.beginPath(); ctx.moveTo(x - s * 0.7, y - s * 0.7); ctx.lineTo(x + s * 0.7, y + s * 0.7); ctx.moveTo(x + s * 0.7, y - s * 0.7); ctx.lineTo(x - s * 0.7, y + s * 0.7); ctx.stroke(); },
    arrow(x, y, s) { ctx.beginPath(); ctx.moveTo(x - s * 0.8, y - s * 0.3); ctx.lineTo(x, y - s * 0.3); ctx.lineTo(x, y - s * 0.75); ctx.lineTo(x + s * 0.85, y); ctx.lineTo(x, y + s * 0.75); ctx.lineTo(x, y + s * 0.3); ctx.lineTo(x - s * 0.8, y + s * 0.3); ctx.closePath(); ctx.fill(); },
  };
  function circleButton(x, y, r, draw, id) {
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = COL.bg; ctx.fill(); ctx.strokeStyle = COL.iconEdge; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = COL.icon; ctx.strokeStyle = COL.icon; ctx.lineCap = 'round'; draw(x, y, r * 0.55); ctx.restore();
    hitButtons.push({ x, y, r: r + 6, id });
  }
  function spawnSparkle(x, y, size) { sparkles.push({ x, y, size, t: 0, life: 0.5 + Math.random() * 0.7, rot: Math.random() * TAU }); }
  function updateSparkles(dt) { for (let i = sparkles.length - 1; i >= 0; i--) { sparkles[i].t += dt; if (sparkles[i].t > sparkles[i].life) sparkles.splice(i, 1); } }
  function drawSparkles() {
    for (const s of sparkles) {
      const k = s.t / s.life, a = Math.sin(k * Math.PI), sz = s.size * (0.5 + 0.5 * a);
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot + k * 0.5); ctx.globalAlpha = a;
      const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, sz * 0.7); gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.4, 'rgba(255,230,150,0.35)'); gr.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, sz * 0.7, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath();
      for (let i = 0; i < 4; i++) { const ang = i * Math.PI / 2; ctx.lineTo(Math.cos(ang) * sz, Math.sin(ang) * sz); ctx.lineTo(Math.cos(ang + Math.PI / 4) * sz * 0.14, Math.sin(ang + Math.PI / 4) * sz * 0.14); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  // ---------------------------------------------------------------- バーガーの描画
  /** placed: [{kind, dx}] を下から積んで描く。戻り値は積み上がりの上端Y */
  function drawStack(placed, cx, baseY, w, opt) {
    opt = opt || {};
    const sway = opt.sway || 0, sq = opt.squash || [];
    Art.draw(ctx, 'bunBottom', cx, baseY, w);
    let h = Core.BUN.bottomThick * w;
    const k = w / Core.DEFAULTS.bunW;
    placed.forEach((p, i) => {
      const x = cx + p.dx * k + sway * h, y = baseY - h;
      const s = sq[i] ? 1 - 0.22 * sq[i] : 1;
      Art.draw(ctx, p.kind, x, y, w, { scaleY: s, scaleX: 1 + (1 - s) * 0.4 });
      if (p.kind !== 'bunTop') h += Core.KINDS[p.kind].thick * w;
    });
    return baseY - h;
  }
  function stackHeight(placed, w) { return (Core.BUN.bottomThick + placed.reduce((a, p) => a + (p.kind === 'bunTop' ? 0 : Core.KINDS[p.kind].thick), 0)) * w; }

  // ---------------------------------------------------------------- プレイ
  function startPlay() {
    game = Core.createGame(Store.data.recipe);
    fall = null; camShift = 0; wobble.th = 0; wobble.om = 0;
    squash.length = 0; popups.length = 0; sparkles.length = 0;
    scene = 'play'; sceneT = 0;
  }
  function onDrop() {
    if (scene !== 'play' || !game) return;
    if (game.drop() === null) return;
    fall = { y: LY.hoverY, v: 0 };
    Snd.ui();
  }
  function updatePlay(dt) {
    game.update(dt);
    const topY = LY.baseY - stackHeight(game.placed, LY.bunW);
    const want = Math.max(0, (LY.hoverY + 78) - topY);
    camShift += (want - camShift) * Math.min(1, dt * 6);
    if (fall) {
      fall.v += game.opts.gravity * dt; fall.y += fall.v * dt;
      const landY = topY + camShift;
      if (fall.y >= landY) {
        const r = game.land(); fall = null;
        squash[game.placed.length - 1] = 1;
        wobble.om += r.dx * 0.0016 + (Math.random() - 0.5) * 0.02;
        Snd.play('land', r.kind === 'patty' || r.kind === 'bunTop' ? 0.8 : 1.1, 0.9);
        Native.haptic(r.perfect ? 'MEDIUM' : 'LIGHT');
        popups.push({ x: LY.cx + r.dx, y: landY - 18, t: 0, str: r.score + '点', perfect: r.perfect });
        if (r.perfect) { Snd.perfect(); for (let i = 0; i < 9; i++) spawnSparkle(LY.cx + r.dx + (Math.random() - 0.5) * LY.bunW * 0.9, landY - 10 + (Math.random() - 0.5) * 40, 8 + Math.random() * 12); }
        if (r.finished) { scene = 'finish'; sceneT = 0; }
      }
    }
    stepCommon(dt);
  }
  function stepCommon(dt) {
    // 揺れ（減衰ばね）
    wobble.om += (-70 * wobble.th - 5.5 * wobble.om) * dt; wobble.th += wobble.om * dt;
    for (let i = 0; i < squash.length; i++) if (squash[i]) squash[i] = Math.max(0, squash[i] - dt * 7);
    for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > 0.9) popups.splice(i, 1); }
    updateSparkles(dt);
  }
  function drawPlay() {
    ctx.fillStyle = COL.bg; ctx.fillRect(-20, -20, L.W + 40, L.H + 40);
    drawStack(game.placed, LY.cx, LY.baseY + camShift, LY.bunW, { sway: wobble.th, squash });
    if (game.state === 'swing') Art.draw(ctx, game.currentKind(), LY.cx + game.offset(), LY.hoverY, LY.bunW);
    else if (fall) Art.draw(ctx, game.currentKind(), LY.cx + game.dropX, fall.y, LY.bunW);
    for (const p of popups) {
      const k = p.t / 0.9;
      text(p.str, p.x, p.y - k * 26, { font: 'bold ' + (p.perfect ? 26 : 20) + 'px ' + ROUND, color: p.perfect ? '#e8a100' : '#8a8a70', stroke: '#fff', strokeW: 5, alpha: 1 - k * k });
    }
    drawSparkles();
    // 進み具合
    const n = game.order.length, done = game.placed.length;
    text('のこり ' + (n - done), L.W - 14, L.safeTop + 20, { font: 'bold 13px ' + SANS, color: '#b5b08a', align: 'right' });
    hitButtons = [];
  }

  // ---------------------------------------------------------------- 結果
  function finishGame() {
    const total = game.total;
    Store.data.made = (Store.data.made || 0) + 1;
    const isHigh = total > (Store.data.high || 0);
    if (isHigh) Store.data.high = total;
    const rank = Core.insertRanking(Store.data.ranking, { score: total, kcal: game.calories(), date: Date.now() }, 10);
    Store.save();
    result = { total, rows: game.resultRows(), kcal: game.calories(), isHigh, rank, placed: game.placed.slice() };
    scene = 'result'; sceneT = 0; sparkles.length = 0; popups.length = 0;
    Snd.fanfare(total >= 700);
  }

  function openShareDialog(t) { shareText.value = t; shareX.href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(t); shareCopy.textContent = 'コピー'; shareDlg.hidden = false; }

  // ---------------------------------------------------------------- 入力
  function toLogical(e) { return { x: (e.clientX - L.offX) / L.scale, y: e.clientY / L.scale }; }
  function hitTest(p) {
    for (let i = hitButtons.length - 1; i >= 0; i--) {
      const b = hitButtons[i];
      if (b.r !== undefined ? Math.hypot(p.x - b.x, p.y - b.y) <= b.r : (Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2)) return b.id;
    }
    return null;
  }
  function act(id) {
    if (!id) return;
    Snd.ui();
    if (id === 'start' || id === 'retry') return startPlay();
    if (id === 'end' || id === 'back') { scene = 'title'; sceneT = 0; return; }
    if (id === 'help' || id === 'about' || id === 'ranking' || id === 'custom') { scene = id; sceneT = 0; return; }
    if (id === 'sound') { Snd.enabled = !Snd.enabled; Store.data.sound = Snd.enabled; Store.save(); if (Snd.enabled) Snd.ui(); return; }
    if (id.startsWith('slot')) {
      const i = Number(id.slice(4)), F = Core.FILLINGS;
      Store.data.recipe[i] = F[(F.indexOf(Store.data.recipe[i]) + 1) % F.length]; Store.save();
      Snd.play('land', 1.2, 0.7);
    }
  }
  function onDown(p) {
    Snd.unlock();
    if (scene === 'play') return onDrop();
    if (scene === 'finish') return;
    const id = hitTest(p);
    if (id === 'share' || id === 'shareapp') { pendingShare = id; return; } // 共有は指を離したときに実行
    act(id);
  }
  function onUp(p) {
    if (!pendingShare) return;
    const id = pendingShare; pendingShare = null;
    if (hitTest(p) !== id) return;
    Snd.ui();
    if (id === 'share') Native.share('バーガー職人で ' + result.total + '点 のハンバーガーを作ったよ！（' + result.kcal + 'kcal） #バーガー職人');
    else Native.share('タイミングよく具を落としてハンバーガーを作る「バーガー職人」であそんでるよ #バーガー職人');
  }
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); onDown(toLogical(e)); }, { passive: false });
  canvas.addEventListener('pointerup', e => { e.preventDefault(); onUp(toLogical(e)); }, { passive: false });
  canvas.addEventListener('pointercancel', () => { pendingShare = null; });
  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (!shareDlg.hidden || e.repeat) return;
    if (e.key === ' ' || e.key === 'Enter') {
      Snd.unlock();
      if (scene === 'play') onDrop(); else if (scene === 'title' || scene === 'result') startPlay();
    } else if (e.key === 'Escape' && scene !== 'play' && scene !== 'finish') { scene = 'title'; }
  });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 100));

  // ---------------------------------------------------------------- メインループ
  function frame(now) {
    let dt = lastNow ? (now - lastNow) / 1000 : 0; lastNow = now;
    if (dt > 0.05) dt = 0.05;
    sceneT += dt; clock += dt;
    ctx.setTransform(L.scale * L.dpr, 0, 0, L.scale * L.dpr, L.offX * L.dpr, 0);
    ctx.fillStyle = COL.bg; ctx.fillRect(-L.offX / L.scale - 5, -5, L.W + 2 * L.offX / L.scale + 10, L.H + 10);
    if (scene === 'title') drawTitle();
    else if (scene === 'help') drawHelp();
    else if (scene === 'about') drawAbout();
    else if (scene === 'ranking') drawRanking();
    else if (scene === 'custom') drawCustom();
    else if (scene === 'play') { updatePlay(dt); drawPlay(); }
    else if (scene === 'finish') { stepCommon(dt); drawPlay(); if (sceneT > 1.1) finishGame(); }
    else if (scene === 'result') { stepCommon(dt); drawResult(dt); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__burger = { get game() { return game; }, Snd, Store, startPlay, onDrop, finishGame, step: () => frame(performance.now()), get scene() { return scene; }, set scene(v) { scene = v; } };
})();
</script>
